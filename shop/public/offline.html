<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>اتصال اینترنت قطع است</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(120% 90% at 80% 0%, #16120a, #04060d 60%);
        color: #e9e6df;
        font-family: Vazirmatn, system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      .box {
        max-width: 420px;
        padding: 32px 24px;
        border-radius: 22px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(255, 255, 255, 0.03);
      }
      .icon {
        width: 74px;
        height: 74px;
        margin: 0 auto 18px;
        display: grid;
        place-items: center;
        font-size: 32px;
        border-radius: 22px;
        border: 1px solid rgba(244, 183, 64, 0.3);
        background: rgba(244, 183, 64, 0.1);
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 10px;
      }
      p {
        color: #a8a196;
        line-height: 2.1;
        font-size: 14px;
        margin: 0 0 18px;
      }
      button {
        padding: 11px 22px;
        border-radius: 14px;
        border: none;
        cursor: pointer;
        font-family: inherit;
        font-weight: 700;
        font-size: 14px;
        color: #2a1c02;
        background: linear-gradient(135deg, #fde08a, #f4b740);
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="icon">📡</div>
      <h1>اینترنت در دسترس نیست</h1>
      <p>
        اتصال شما قطع شده و صفحه بارگذاری نشد. سرویس VPN شما مستقل از این سایت کار می‌کند؛ بعد از
        وصل‌شدن دوباره امتحان کنید.
      </p>
      <button onclick="location.reload()">تلاش دوباره</button>
    </div>
  </body>
</html>
