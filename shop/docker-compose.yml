services:
  shop:
    build: .
    image: fandogh-shop:latest
    container_name: fandogh-shop
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: "file:../data/fandogh.db"
      UPLOAD_DIR: "/app/data/uploads"
      PORT: "3000"
    ports:
      # پیش‌فرض روی همه اینترفیس‌ها باز است تا با IP سرور در دسترس باشد.
      # وقتی Nginx را جلوی آن گذاشتید، در .env مقدار BIND_ADDR=127.0.0.1 را تنظیم کنید.
      - "${BIND_ADDR:-0.0.0.0}:${APP_PORT:-3000}:3000"
    volumes:
      - ./data:/app/data
